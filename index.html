<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1b"><title>NEON CLASH</title>
<style>
:root{color-scheme:dark;--bg:#090d1b;--panel:#111a30;--line:#293957;--cyan:#51f6e3;--pink:#ff5c9d;--gold:#ffd66b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#f4f7ff;touch-action:none;user-select:none}#app{height:100dvh;display:flex;flex-direction:column;max-width:980px;margin:auto;padding:clamp(7px,2vw,18px);gap:8px;background:radial-gradient(ellipse at 50% 0%,#182442 0%,#090d1b 68%)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}h1{font-size:clamp(17px,3.6vw,27px);letter-spacing:.13em;margin:0;font-weight:950}h1 span{color:var(--cyan)}.tag{font-size:10px;letter-spacing:.15em;color:#91a4c9;border:1px solid #293957;padding:5px 8px;border-radius:99px}.arena{position:relative;flex:1;min-height:210px;max-height:56vh;border:1px solid #344568;border-radius:14px;overflow:hidden;background:#101831;box-shadow:0 0 35px #51f6e310}.hud{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:9px}.fighter-name{font-size:11px;font-weight:900;letter-spacing:.12em;margin-bottom:5px}.right{text-align:right}.health{height:13px;background:#26324c;border:1px solid #536485;border-radius:4px;overflow:hidden;transform:skewX(-9deg)}.health>div{height:100%;width:100%;transition:width .15s;background:linear-gradient(90deg,#51f6e3,#b0fff7)}.right .health>div{margin-left:auto;background:linear-gradient(90deg,#ffb0d0,#ff5c9d)}.round{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.12em;text-align:center;padding-top:2px;white-space:nowrap}.status{position:absolute;z-index:3;top:70px;left:0;right:0;text-align:center;font-weight:1000;letter-spacing:.16em;font-size:clamp(17px,4vw,28px);text-shadow:0 3px 0 #080b15,0 0 20px #51f6e366;pointer-events:none}.status small{display:block;font-size:10px;color:#d4e1ff;letter-spacing:.08em;margin-top:4px}.arena canvas{display:block;width:100%;height:100%}.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.panel{background:linear-gradient(135deg,#131d35,#0e1528);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}.panel h2{font-size:11px;letter-spacing:.13em;color:#a8badc;margin:0 0 7px}.guide-line{display:flex;align-items:center;gap:5px;min-height:25px;flex-wrap:wrap}.key{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:23px;padding:0 6px;border:1px solid #4d678d;border-bottom-width:3px;border-radius:6px;background:#1a2945;color:#e8f4ff;font-size:11px;font-weight:900}.key.next{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px #ffd66b35}.arrow{color:#7e93b8;font-size:11px}.guide-name{font-size:11px;color:var(--cyan);font-weight:800;margin-top:5px}.hint{font-size:10px;color:#91a3c6;line-height:1.5;margin-top:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}.pad,.actions{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(42px,1fr));gap:6px;min-height:92px}.actions{grid-template-columns:repeat(2,1fr)}button{font:inherit;color:#f5f8ff;border:1px solid #35496e;border-bottom-width:3px;border-radius:11px;background:linear-gradient(180deg,#202e4b,#141e35);font-weight:900;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active,button.pressed{transform:translateY(2px);border-bottom-width:1px;background:#2d4164}button.dir{font-size:18px;color:#d8e7ff}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.rightdir{grid-column:3;grid-row:2}.attack{font-size:13px;letter-spacing:.04em}.punch{border-color:#397f87;color:#80fff1}.kick{border-color:#874567;color:#ff9fc5}.special{grid-column:1 / -1;color:var(--gold);font-size:11px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:#8395b7}.foot button{padding:6px 10px;font-size:10px;border-radius:8px;white-space:nowrap}.toast{position:absolute;z-index:4;bottom:10px;left:50%;transform:translateX(-50%);background:#101a2ee8;border:1px solid #4b6689;border-radius:99px;padding:6px 12px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}.toast.show{opacity:1}@media(min-width:700px){#app{gap:10px}.arena{max-height:52vh}.below{grid-template-columns:1fr 1fr}.controls{max-width:620px;width:100%;margin:0 auto}.pad,.actions{min-height:100px}.panel{padding:12px 15px}}@media(max-height:680px){#app{gap:5px;padding:6px}.arena{min-height:175px;max-height:43vh}.panel{padding:7px 9px}.pad,.actions{min-height:76px;grid-template-rows:repeat(2,minmax(34px,1fr))}.hint{display:none}.foot{font-size:9px}}
</style></head>
<body><main id="app"><header><h1>NEON <span>CLASH</span></h1><div class="tag">2D FIGHTER · VS CPU</div></header>
<section class="arena" id="arena"><canvas id="game"></canvas><div class="hud"><div><div class="fighter-name">YOU // RAY</div><div class="health"><div id="hp1"></div></div></div><div class="round" id="round">ROUND 01<br>FIGHT!</div><div class="right"><div class="fighter-name">CPU // VEX</div><div class="health"><div id="hp2"></div></div></div></div><div class="status" id="status">READY?<small>ボタンを押してバトル開始</small></div><div class="toast" id="toast"></div></section>
<section class="below"><div class="panel"><h2>COMMAND GUIDE / 次の入力</h2><div class="guide-line" id="guide"></div><div class="guide-name" id="guideName">↓ → ＋ P：NEON SHOT</div><div class="hint">方向キーを順番に入力。光るキーが次の入力！ 強技ほどコマンドが長い。</div></div><div class="panel"><h2>BATTLE LOG / 操作</h2><div class="guide-line"><span class="key">方向</span><span class="arrow">移動・しゃがみ</span><span class="key">↑</span><span class="arrow">ジャンプ</span></div><div class="guide-line" style="margin-top:5px"><span class="key">P</span><span class="arrow">パンチ</span><span class="key">K</span><span class="arrow">キック</span></div><div class="hint" id="log">CPUは移動と通常攻撃のみ。コマンド技を決めよう！</div></div></section>
<section class="controls"><div class="pad"><button class="dir up" data-dir="up" aria-label="ジャンプ">▲</button><button class="dir left" data-dir="left" aria-label="左">◀</button><button class="dir down" data-dir="down" aria-label="下">▼</button><button class="dir rightdir" data-dir="right" aria-label="右">▶</button></div><div class="actions"><button class="attack punch" data-act="p">P<br><small>パンチ</small></button><button class="attack kick" data-act="k">K<br><small>キック</small></button><button class="special" id="specialBtn">コマンド技一覧 ▾</button></div></section>
<div class="foot"><span>画面ボタン / キーボード対応（← → ↑ ↓・J・K）</span><button id="restart">↻ リスタート</button></div></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),arena=document.getElementById('arena');let W=800,H=400,dpr=1,last=0,started=false,over=false,toastTimer=0,keys=new Set(),inputSeq=[],guideMode=0,shake=0;
const $=id=>document.getElementById(id);const moves=[{name:'NEON SHOT',seq:['down','right','p'],label:'↓ → ＋ P',power:13,kind:'shot'},{name:'RISING ARC',seq:['right','down','right','p'],label:'→ ↓ → ＋ P',power:17,kind:'rise'},{name:'NOVA BREAK',seq:['down','right','down','right','p','k'],label:'↓ → ↓ → ＋ P ＋ K',power:28,kind:'nova'}];
const mk=(x,face,color)=>({x,y:0,vx:0,vy:0,face,color,hp:100,max:100,ground:true,atk:0,cd:0,flash:0,stun:0,walk:0,projectiles:[],name:'',jumping:false});let a=mk(190,1,'#51f6e3'),b=mk(610,-1,'#ff5c9d');const floor=()=>H-53;function resize(){const r=arena.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(220,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);a.x=Math.min(a.x,W*.45);b.x=Math.max(b.x,W*.76);draw()}new ResizeObserver(resize).observe(arena);
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1250)}function start(){if(!started){started=true;$('status').innerHTML='FIGHT!<small>さあ、いこう！</small>';setTimeout(()=>{if(started&&!over)$('status').style.opacity='0'},900)}}function reset(){a=mk(W*.25,1,'#51f6e3');b=mk(W*.76,-1,'#ff5c9d');started=false;over=false;inputSeq=[];keys.clear();$('status').style.opacity='1';$('status').innerHTML='READY?<small>ボタンを押してバトル開始</small>';$('round').innerHTML='ROUND 01<br>FIGHT!';$('log').textContent='CPUは移動と通常攻撃のみ。コマンド技を決めよう！';updateHud();renderGuide();draw()}
function dir(d){start();if(over)return;if(d==='left'||d==='right'){keys.delete(d==='left'?'right':'left');keys.add(d);input(d)}else if(d==='up'){a.vy=-Math.min(570,H*1.5);a.ground=false;input('up')}else if(d==='down'){input('down');} }
function releaseDir(d){keys.delete(d)}function attack(type){start();if(over)return;input(type);if(a.atk>0||a.cd>0||a.stun>0)return;a.atk=type==='p'?0.19:0.27;a.cd=type==='p'?0.25:0.38;a.attackType=type;a.attackPower=type==='p'?6:9;}
function input(v){const t=performance.now();inputSeq.push({v,t});inputSeq=inputSeq.filter(q=>t-q.t<1450).slice(-10);let matched=false;for(const m of moves){let vals=inputSeq.map(q=>q.v),idx=0;for(const val of vals){if(val===m.seq[idx])idx++;else if(val===m.seq[0])idx=1;}if(idx===m.seq.length){special(m);inputSeq=[];matched=true;break;}}renderGuide();if(!matched){for(const m of moves){let vals=inputSeq.map(q=>q.v),idx=0;for(const val of vals){if(val===m.seq[idx])idx++;else if(val===m.seq[0])idx=1;}if(idx>0){$('guideName').textContent=m.name+' · '+m.label;break;}}}}
function special(m){if(a.cd>0.08){say('少し待ってから入力！');return}start();a.atk=.36;a.cd=.55;a.attackType=m.kind;a.attackPower=m.power;a.flash=.2;$('log').textContent='SPECIAL! '+m.name+' — '+m.power+' DAMAGE';say(m.name+'!!');if(m.kind==='shot'){a.projectiles.push({x:a.x+a.face*30,y:floor()-54,vx:a.face*Math.max(300,W*.65),power:m.power,life:1.3,color:'#6bfff0',r:10})}else if(m.kind==='nova'){a.projectiles.push({x:a.x+a.face*30,y:floor()-48,vx:a.face*W*.8,power:m.power,life:.55,color:'#ffe477',r:23})}else{a.vy=-Math.min(420,H*1.1);a.ground=false;a.x+=a.face*32;}shake=8;}
function renderGuide(){const el=$('guide');el.innerHTML='';let m=moves[guideMode],vals=inputSeq.map(q=>q.v),idx=0;for(const val of vals){if(val===m.seq[idx])idx++;else if(val===m.seq[0])idx=1;}for(let i=0;i<m.seq.length;i++){if(i)el.insertAdjacentHTML('beforeend','<span class="arrow">›</span>');let labels={down:'↓',right:'→',left:'←',up:'↑',p:'P',k:'K'};el.insertAdjacentHTML('beforeend',`<span class="key ${i===idx?'next':''}">${labels[m.seq[i]]}</span>`)}$('guideName').textContent=m.name+' · '+m.label}
$('specialBtn').addEventListener('click',()=>{guideMode=(guideMode+1)%moves.length;renderGuide();say('ガイド：'+moves[guideMode].name)});document.querySelectorAll('[data-dir]').forEach(el=>{let d=el.dataset.dir;el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('pressed');el.setPointerCapture?.(e.pointerId);dir(d)});const up=e=>{el.classList.remove('pressed');releaseDir(d)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});document.querySelectorAll('[data-act]').forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('pressed');attack(el.dataset.act)});const up=()=>el.classList.remove('pressed');el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});$('restart').addEventListener('click',reset);
window.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',j:'p',J:'p',k:'k',K:'k'};if(map[e.key]){e.preventDefault();if(e.repeat)return;let v=map[e.key];if(v==='p'||v==='k')attack(v);else dir(v)}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')releaseDir('left');if(e.key==='ArrowRight')releaseDir('right')});
function hit(att,def,power){def.hp=Math.max(0,def.hp-power);def.stun=.22;def.flash=.16;def.x+=att.face*power*1.4;shake=Math.min(10,shake+power*.2);updateHud();if(def.hp<=0){over=true;$('status').style.opacity='1';$('status').innerHTML=(def===b?'YOU WIN!':'CPU WINS')+'<small>リスタートで再戦</small>';$('round').innerHTML='RESULT';say(def===b?'VICTORY!':'TRY AGAIN');}}
function updateHud(){$('hp1').style.width=a.hp+'%';$('hp2').style.width=b.hp+'%'}
function update(dt){if(!started||over)return;for(const f of [a,b]){f.cd=Math.max(0,f.cd-dt);f.atk=Math.max(0,f.atk-dt);f.stun=Math.max(0,f.stun-dt);f.flash=Math.max(0,f.flash-dt);f.vy+=Math.min(1800,H*4)*dt;f.y+=f.vy*dt;if(f.y>=0){f.y=0;f.vy=0;f.ground=true}f.x+=f.vx*dt;f.vx*=Math.pow(.001,dt);f.x=Math.max(26,Math.min(W-26,f.x));}
const speed=Math.max(160,W*.42);a.vx=0;if(a.stun===0){if(keys.has('left'))a.vx=-speed;if(keys.has('right'))a.vx=speed;}a.face=a.x<b.x?1:-1;b.face=b.x<a.x?1:-1;
// CPU brain: approach, retreat slightly, and use only basic punches/kicks.
if(b.stun===0){let dist=a.x-b.x;b.vx=0;if(Math.abs(dist)>Math.min(125,W*.18))b.vx=Math.sign(dist)*speed*.54;else if(Math.random()<dt*.45)b.vx=-Math.sign(dist)*speed*.2;if(Math.abs(dist)<Math.min(94,W*.14)&&b.cd<=0&&Math.random()<dt*1.15){b.atk=.22;b.cd=.8+Math.random()*.35;b.attackType=Math.random()<.6?'p':'k';b.attackPower=b.attackType==='p'?5:7;}}
for(const f of [a,b]){if(f.atk>0&&f.atk<.11&&!f.didHit){f.didHit=true;let other=f===a?b:a;if(Math.abs(f.x-other.x)<Math.min(100,W*.15)&&Math.abs(f.y-other.y)<55&&f.face===(other.x>f.x?1:-1)){hit(f,other,f.attackPower||5)}}if(f.atk===0)f.didHit=false;for(const p of f.projectiles){p.x+=p.vx*dt;p.life-=dt;let other=f===a?b:a;if(Math.abs(p.x-other.x)<p.r+19&&Math.abs(p.y-(floor()+other.y-52))<45&&p.life>0){hit(f,other,p.power);p.life=0}}f.projectiles=f.projectiles.filter(p=>p.life>0&&p.x>-50&&p.x<W+50)}a.x=Math.max(20,Math.min(W-20,a.x));b.x=Math.max(20,Math.min(W-20,b.x));shake=Math.max(0,shake-dt*28);updateHud();}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawFighter(f){
  const t=performance.now()/1000;
  const moving=Math.abs(f.vx)>18&&f.ground;
  const attacking=f.atk>0;
  const duration=f.attackType==='rise'||f.attackType==='nova'||f.attackType==='shot'
    ? .36 : f.attackType==='k' ? .27 : .22;
  const phase=attacking?Math.max(0,Math.min(1,1-f.atk/duration)):0;
  const smooth=v=>v*v*(3-2*v);
  const swing=Math.sin(t*10);
  const bob=f.ground?(moving?Math.abs(swing)*3:Math.sin(t*2.5)*1.3):0;
  const kick=f.attackType==='k';
  const punch=f.attackType==='p';
  const special=f.attackType==='shot'||f.attackType==='nova'||f.attackType==='rise';
  const strike=smooth(Math.min(1,phase*2.5))*
    (1-smooth(Math.max(0,(phase-.52)/.48)));
  const x=f.x,y=floor()+f.y+bob,face=f.face;
  const crouch=keys.has('down')&&f===a&&f.ground&&!attacking?7:0;

  // Kick: lift the front leg, extend it, then retract it.
  const kickLift=kick&&attacking?Math.sin(phase*Math.PI)*15:0;
  const kickReach=kick&&attacking?30*strike:0;
  const lean=kick&&attacking?-0.12*strike:
    attacking&&!special?0.08*strike:0;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(face,1);
  ctx.rotate(lean);

  ctx.globalAlpha=.24;
  ctx.fillStyle=f.color;
  ctx.beginPath();
  ctx.ellipse(0,2,25,5,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  const stroke=(width)=>{
    ctx.strokeStyle=f.color;
    ctx.lineWidth=width;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.shadowColor=f.color;
    ctx.shadowBlur=f.flash?24:7;
  };
  const line=(x1,y1,x2,y2)=>{
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  };

  // Legs: kick uses a separate extended-leg pose.
  stroke(4);
  const step=moving?swing*8:0;
  const bodyY=-43+crouch;
  const hipY=-27+crouch*.5;

  // Rear leg
  line(-5,hipY,-10+step*.35,-13);
  line(-10+step*.35,-13,-15+step*.35,-3);

  if(kick&&attacking){
    // Kicking leg: knee bends during wind-up, then foot extends forward.
    const windup=1-smooth(Math.min(1,phase*3));
    const kneeX=8-windup*8+kickReach*.45;
    const kneeY=-17-kickLift*.45;
    const footX=12+kickReach;
    const footY=-7-kickLift;
    line(5,hipY,kneeX,kneeY);
    line(kneeX,kneeY,footX,footY);
    stroke(5);
    line(footX-5,footY,footX+9,footY-1);
  }else{
    line(5,hipY,10-step,-14);
    line(10-step,-14,17-step,-3);
    stroke(5);
    line(10-step,-3,22-step,-3);
  }

  stroke(5);
  line(-21+step*.35,-3,-10+step*.35,-3);

  // Torso
  stroke(4);
  ctx.fillStyle=f.flash?'#fff':'#17223a';
  ctx.beginPath();
  ctx.moveTo(-9,bodyY-8);
  ctx.lineTo(8,bodyY-8);
  ctx.lineTo(11,bodyY+12);
  ctx.lineTo(4,bodyY+20);
  ctx.lineTo(-9,bodyY+15);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle=f.color;
  ctx.fillRect(-5,bodyY-3,10,3);

  // Rear arm
  stroke(4);
  const backElbowX=-15+step*.35;
  const backElbowY=bodyY+3+swing*1.5;
  line(-5,bodyY-3,backElbowX,backElbowY);
  line(backElbowX,backElbowY,-9,bodyY+13);

  // Front arm: keep it guarded during kicks.
  const shoulderX=5,shoulderY=bodyY-4;
  let elbowX,elbowY,handX,handY;

  if(kick&&attacking){
    elbowX=10;
    elbowY=bodyY+1;
    handX=7;
    handY=bodyY+10;
  }else if(attacking){
    const reach=special?52:punch?36:20;
    elbowX=13+reach*.32*strike;
    elbowY=bodyY-5-strike*2;
    handX=19+reach*strike;
    handY=bodyY-8-strike*3;
    const windup=1-smooth(Math.min(1,phase*3));
    if(!special){
      elbowX-=windup*9;
      handX-=windup*13;
      handY+=windup*4;
    }
  }else{
    elbowX=13+swing*1.5;
    elbowY=bodyY+3+swing*2;
    handX=19+swing*2;
    handY=bodyY+8+swing*2;
  }

  stroke(5);
  line(shoulderX,shoulderY,elbowX,elbowY);
  line(elbowX,elbowY,handX,handY);
  ctx.fillStyle=f.flash?'#fff':f.color;
  ctx.beginPath();
  ctx.arc(handX,handY,4.5,0,Math.PI*2);
  ctx.fill();

  // Head
  const headX=lean*18;
  const headY=-66+crouch*.7;
  ctx.shadowColor=f.color;
  ctx.shadowBlur=f.flash?25:7;
  ctx.fillStyle=f.flash?'#fff':'#e2eaff';
  ctx.beginPath();
  ctx.arc(headX,headY,9,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=f.color;
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle=f.color;
  ctx.fillRect(headX+1,headY-3,9,3);

  // Motion arc for punches and special attacks, not kicks.
  if(attacking&&!kick&&strike>.15){
    ctx.globalAlpha=.25+.45*strike;
    ctx.strokeStyle=f.color;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(handX+4,handY,10,-.9,.8);
    ctx.stroke();
  }
  ctx.restore();
}
